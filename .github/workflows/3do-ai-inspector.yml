name: 3DO AI modeling toolkit

on:
  pull_request:
    paths:
      - 'icr2_3do_ai/**'
      - 'icr2_3do_cad/**'
      - '.github/workflows/3do-ai-inspector.yml'
  push:
    paths:
      - 'icr2_3do_ai/**'
      - 'icr2_3do_cad/**'
      - '.github/workflows/3do-ai-inspector.yml'

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install non-UI dependencies
        run: python -m pip install numpy Pillow
      - name: Validate new inspector Python files
        run: python -m compileall -q icr2_3do_ai
      - name: Run semantic inspector and Stage 2/3 modeling tests
        run: python -m unittest discover -s icr2_3do_ai/tests -p 'test_*.py' -v
      - name: Smoke-test CLI on stock car fixture
        run: |
          python -m icr2_3do_ai inspect icr2_3do_cad/fixtures/indycar.3do \
            --objects-folder icr2_3do_cad/fixtures \
            --texture-folder icr2_3do_cad/fixtures \
            --views -o /tmp/3do-ai-inspector-smoke
          test -s /tmp/3do-ai-inspector-smoke/summary.json
          test -s /tmp/3do-ai-inspector-smoke/scene_graph.json
          test -s /tmp/3do-ai-inspector-smoke/views/side.png
      - name: Generate N3 models for checked-in recipes
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p /tmp/3do-ai-recipes
          count=0
          for recipe in icr2_3do_ai/recipes/*.json; do
            name="$(basename "$recipe" .json)"
            echo "Building recipe: $recipe"
            python -m icr2_3do_ai generate "$recipe" \
              --views -o "/tmp/3do-ai-recipes/$name"
            python -m icr2_3do_ai validate "/tmp/3do-ai-recipes/$name/model.3do"
            count=$((count + 1))
          done
          echo "Built $count checked-in recipes"
          test "$count" -gt 0
      - name: Publish generated source, binary and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: 3do-ai-generated-models
          path: /tmp/3do-ai-recipes/
          if-no-files-found: error
          retention-days: 14

      - name: Build Stage 3 modeling jobs
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p /tmp/3do-ai-jobs
          count=0
          for job in icr2_3do_ai/jobs/*.json; do
            name="$(basename "$job" .json)"
            echo "Executing modeling job: $job"
            python -m icr2_3do_ai build-job "$job" \
              --repository-root . -o "/tmp/3do-ai-jobs/$name"
            python -m icr2_3do_ai validate \
              "/tmp/3do-ai-jobs/$name/generated/model.3do"
            test -s "/tmp/3do-ai-jobs/$name/change_report.json"
            count=$((count + 1))
          done
          echo "Built $count Stage 3 jobs"
          test "$count" -gt 0
      - name: Upload Stage 3 editable CAD models and comparison reports
        uses: actions/upload-artifact@v4
        with:
          name: 3do-ai-stage3-modeling-jobs
          path: /tmp/3do-ai-jobs/
          if-no-files-found: error
          retention-days: 14
