name: 3DO AI semantic inspector

on:
  pull_request:
    paths:
      - 'icr2_3do_ai/**'
      - 'icr2_3do_cad/**'
      - '.github/workflows/3do-ai-inspector.yml'
  push:
    paths:
      - 'icr2_3do_ai/**'
      - 'icr2_3do_cad/**'
      - '.github/workflows/3do-ai-inspector.yml'

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install non-UI dependencies
        run: python -m pip install numpy Pillow
      - name: Validate new inspector Python files
        run: python -m compileall -q icr2_3do_ai
      - name: Run semantic inspector and procedural N3 generator tests
        run: python -m unittest discover -s icr2_3do_ai/tests -p 'test_*.py' -v
      - name: Smoke-test CLI on stock car fixture
        run: |
          python -m icr2_3do_ai inspect icr2_3do_cad/fixtures/indycar.3do \
            --objects-folder icr2_3do_cad/fixtures \
            --texture-folder icr2_3do_cad/fixtures \
            --views -o /tmp/3do-ai-inspector-smoke
          test -s /tmp/3do-ai-inspector-smoke/summary.json
          test -s /tmp/3do-ai-inspector-smoke/scene_graph.json
          test -s /tmp/3do-ai-inspector-smoke/views/side.png
      - name: Generate N3 models for checked-in recipes
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p /tmp/3do-ai-recipes
          count=0
          for recipe in icr2_3do_ai/recipes/*.json; do
            name="$(basename "$recipe" .json)"
            echo "Building recipe: $recipe"
            python -m icr2_3do_ai generate "$recipe" \
              --views -o "/tmp/3do-ai-recipes/$name"
            python -m icr2_3do_ai validate "/tmp/3do-ai-recipes/$name/model.3do"
            count=$((count + 1))
          done
          echo "Built $count checked-in recipes"
          test "$count" -gt 0
      - name: Assemble and inspect Marmon Wasp three-object car
        shell: bash
        run: |
          python -m icr2_3do_ai.assemble_wasp \
            --body /tmp/3do-ai-recipes/marmon_wasp_1911_lowpoly \
            --front /tmp/3do-ai-recipes/marmon_wasp_front_wheel \
            --rear /tmp/3do-ai-recipes/marmon_wasp_rear_wheel \
            --output /tmp/3do-ai-recipes/marmon_wasp_complete
          python -m icr2_3do_ai validate /tmp/3do-ai-recipes/marmon_wasp_complete/WASP.3do
          python -m icr2_3do_ai validate /tmp/3do-ai-recipes/marmon_wasp_complete/HELMET.3do
          python -m icr2_3do_ai inspect /tmp/3do-ai-recipes/marmon_wasp_complete/WASP.3do \
            --objects-folder /tmp/3do-ai-recipes/marmon_wasp_complete \
            --views -o /tmp/3do-ai-recipes/marmon_wasp_complete/scene_analysis
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("/tmp/3do-ai-recipes/marmon_wasp_complete")
          scene=json.loads((root/"scene_analysis"/"scene_graph.json").read_text())
          instances=scene.get("instances", [])
          if len(instances)!=6:
              raise SystemExit(f"Expected body, 4 wheel instances and helmet sprite, got {len(instances)}")
          helmet=root/"HELMET.3do"
          if not helmet.is_file() or helmet.stat().st_size!=1040:
              raise SystemExit("Missing unchanged stock helmet.3do eight-view sprite")
          print("Verified complete Wasp:", len(instances), "model instances incl. HELMET")
          PY
      - name: Publish generated source, binary and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: 3do-ai-generated-models
          path: /tmp/3do-ai-recipes/
          if-no-files-found: error
          retention-days: 14
