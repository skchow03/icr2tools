name: 3DO CAD OpenGL smoke

on:
  push:
    paths:
      - 'icr2_3do_cad/**'
      - 'icr2_core/trk/**'
      - '.github/workflows/3do-cad-smoke.yml'
  pull_request:
    paths:
      - 'icr2_3do_cad/**'
      - 'icr2_core/trk/**'
      - '.github/workflows/3do-cad-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Mesa software OpenGL and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libegl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-xinput0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libxcb-render0 libxcb-shm0 libxcb-sync1 libx11-xcb1
      - name: Install viewer dependencies
        run: python -m pip install -r icr2_3do_cad/requirements.txt
      - name: Verify 3.3 context, OpenGL buffers and actual framebuffer
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_QPA_PLATFORM: xcb
          QT_OPENGL: desktop
        run: |
          xvfb-run -a -s "-screen 0 1280x960x24 +extension GLX" \
            python icr2_3do_cad/smoke_test.py \
            icr2_3do_cad/fixtures/roadcar.3do
      - name: Check simplified sidebar and LOD selection
        working-directory: icr2_3do_cad
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_QPA_PLATFORM: xcb
          QT_OPENGL: desktop
        run: |
          xvfb-run -a -s "-screen 0 1280x960x24 +extension GLX" \
            python -m unittest discover -s tests -p 'test_viewer_layout.py'
      - name: Test 3DO CAD File, View, Assets, Help menus and source saving
        working-directory: icr2_3do_cad
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_QPA_PLATFORM: xcb
          QT_OPENGL: desktop
        run: |
          xvfb-run -a -s "-screen 0 1280x960x24 +extension GLX" \
            python -m unittest discover -s tests -p 'test_menus.py'
      - name: Verify explicit destructive confirmations and safe Cancel defaults
        working-directory: icr2_3do_cad
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_QPA_PLATFORM: xcb
          QT_OPENGL: desktop
        run: |
          xvfb-run -a -s "-screen 0 1280x960x24 +extension GLX" \
            python -m unittest discover -s tests -p 'test_confirmations_ui.py'
      - name: Test automatic same-folder SUNNY.PCX palette selection
        working-directory: icr2_3do_cad
