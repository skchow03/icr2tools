name: 3DO CAD GPU viewer smoke

on:
  push:
    paths:
      - "icr2_3do_cad/gpu_viewer/**"
      - "icr2_3do_cad/three_do.py"
      - "icr2_3do_cad/pmp_preview.py"
      - "icr2_3do_cad/tests/test_gpu_pmp_gl.py"
      - "icr2_3do_cad/tests/test_gpu_uv_repeat_gl.py"
      - "icr2_3do_cad/tests/test_gpu_track_skybox_gl.py"
      - "icr2_3do_cad/tests/test_gpu_track_navigation_ui.py"
      - "icr2_3do_cad/tests/test_gpu_track_tsd_depth_gl.py"
      - "icr2_3do_cad/tests/test_gpu_poly_highlight_gl.py"
      - "icr2_3do_cad/tests/test_gpu_bsp_overlay_gl.py"
      - "icr2_3do_cad/tests/test_gpu_bsp_inspection_ui.py"
      - "icr2_3do_cad/tests/test_gpu_source_help_ui.py"
      - "icr2_3do_cad/tests/test_gpu_source_scale_ui.py"
      - "icr2_3do_cad/tests/test_gpu_source_scale.py"
      - "icr2_3do_cad/tests/test_gpu_polygon_split_ui.py"
      - "icr2_3do_cad/tests/test_gpu_n3_source_help.py"
      - "icr2_3do_cad/tests/test_gpu_confirmations_ui.py"
      - "icr2_core/trk/**"
      - "icr2_3do_cad/tests/test_pmp_variants.py"
      - "icr2_3do_cad/n3_compile.py"
      - "icr2_3do_cad/tests/test_gpu_viewer_mesh.py"
      - ".github/workflows/3do-cad-gpu-smoke.yml"
  pull_request:
    paths:
      - "icr2_3do_cad/gpu_viewer/**"
      - "icr2_3do_cad/three_do.py"
      - "icr2_3do_cad/pmp_preview.py"
      - "icr2_3do_cad/tests/test_gpu_pmp_gl.py"
      - "icr2_3do_cad/tests/test_gpu_uv_repeat_gl.py"
      - "icr2_3do_cad/tests/test_gpu_track_skybox_gl.py"
      - "icr2_3do_cad/tests/test_gpu_track_navigation_ui.py"
      - "icr2_3do_cad/tests/test_gpu_track_tsd_depth_gl.py"
      - "icr2_3do_cad/tests/test_gpu_poly_highlight_gl.py"
      - "icr2_3do_cad/tests/test_gpu_bsp_overlay_gl.py"
      - "icr2_3do_cad/tests/test_gpu_bsp_inspection_ui.py"
      - "icr2_3do_cad/tests/test_gpu_source_help_ui.py"
      - "icr2_3do_cad/tests/test_gpu_source_scale_ui.py"
      - "icr2_3do_cad/tests/test_gpu_source_scale.py"
      - "icr2_3do_cad/tests/test_gpu_polygon_split_ui.py"
      - "icr2_3do_cad/tests/test_gpu_n3_source_help.py"
      - "icr2_3do_cad/tests/test_gpu_confirmations_ui.py"
      - "icr2_core/trk/**"
      - "icr2_3do_cad/tests/test_pmp_variants.py"
      - "icr2_3do_cad/n3_compile.py"
      - "icr2_3do_cad/tests/test_gpu_viewer_mesh.py"
      - ".github/workflows/3do-cad-gpu-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Mesa software OpenGL and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libegl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-xinput0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libxcb-render0 libxcb-shm0 libxcb-sync1 libx11-xcb1
      - name: Install viewer dependencies
        run: python -m pip install -r icr2_3do_cad/gpu_viewer/requirements.txt
      - name: Verify 3.3 context, GPU buffers and actual framebuffer
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_QPA_PLATFORM: xcb
          QT_OPENGL: desktop
        run: |
          xvfb-run -a -s "-screen 0 1280x960x24 +extension GLX" \
            python icr2_3do_cad/gpu_viewer/smoke_test.py \
            icr2_3do_cad/fixtures/roadcar.3do
      - name: Check simplified sidebar and LOD selection
        working-directory: icr2_3do_cad
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_QPA_PLATFORM: xcb
          QT_OPENGL: desktop
        run: |
          xvfb-run -a -s "-screen 0 1280x960x24 +extension GLX" \
            python -m unittest discover -s tests -p 'test_gpu_viewer_layout.py'
      - name: Test GPU viewer File, View, Assets, Help menus and source saving
        working-directory: icr2_3do_cad
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_QPA_PLATFORM: xcb
          QT_OPENGL: desktop
        run: |
          xvfb-run -a -s "-screen 0 1280x960x24 +extension GLX" \
            python -m unittest discover -s tests -p 'test_gpu_menus.py'
      - name: Verify explicit destructive confirmations and safe Cancel defaults
        working-directory: icr2_3do_cad
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_QPA_PLATFORM: xcb
          QT_OPENGL: desktop
        run: |
          xvfb-run -a -s "-screen 0 1280x960x24 +extension GLX" \
            python -m unittest discover -s tests -p 'test_gpu_confirmations_ui.py'
      - name: Test automatic same-folder SUNNY.PCX palette selection
        working-directory: icr2_3do_cad
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_QPA_PLATFORM: xcb
          QT_OPENGL: desktop
        run: |
          xvfb-run -a -s "-screen 0 1280x960x24 +extension GLX" \
            python -m unittest discover -s tests -p 'test_gpu_palette_autoselect_ui.py'
      - name: Check highlighted white polygons and custom tint in OpenGL
        working-directory: icr2_3do_cad
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_QPA_PLATFORM: xcb
