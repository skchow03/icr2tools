name: REND32A Multi-Car

on:
  pull_request:
    paths:
      - "icr2multicar_rend32a/**"
      - ".github/workflows/rend32a-multicar.yml"
  push:
    branches: [main]
    paths:
      - "icr2multicar_rend32a/**"
      - ".github/workflows/rend32a-multicar.yml"

jobs:
  smoke-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m py_compile icr2multicar_rend32a/rend32a_multicar.py
      - name: Check command-line help
        run: python icr2multicar_rend32a/rend32a_multicar.py --help
      - name: Verify embedded delta decodes
        shell: pwsh
        run: |
          python -c "import sys,base64,zlib;sys.path.insert(0,'icr2multicar_rend32a');import rend32a_multicar as p;d=zlib.decompress(base64.b85decode(''.join(p._BASELINE_DELTA)));assert len(d)>100;print('Encoded replacement patch verified:',len(d),'bytes')"
