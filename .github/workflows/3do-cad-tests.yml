name: 3DO CAD regression tests

on:
  push:
    paths:
      - 'icr2_3do_cad/**'
      - '.github/workflows/3do-cad-tests.yml'
  pull_request:
    paths:
      - 'icr2_3do_cad/**'
      - '.github/workflows/3do-cad-tests.yml'

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Mesa, virtual display, Qt dependencies and renderer requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libegl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-xinput0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libxcb-render0 libxcb-shm0 libxcb-sync1 libx11-xcb1
          python -m pip install -r icr2_3do_cad/requirements.txt
      - name: Compile application source and tests
        working-directory: icr2_3do_cad
        run: python -m compileall -q .
      - name: Run CAD regressions
        working-directory: icr2_3do_cad
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          QT_QPA_PLATFORM: xcb
          QT_OPENGL: desktop
        run: xvfb-run -a -s "-screen 0 1280x960x24 +extension GLX" python -m unittest discover -s tests -p 'test_*.py'
